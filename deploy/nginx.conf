server {
    listen 80;
    server_name cloudflare.w-b.dev;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name cloudflare.w-b.dev;

    # SSL configuration - certbot will manage these
    ssl_certificate /etc/letsencrypt/live/cloudflare.w-b.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudflare.w-b.dev/privkey.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Screenshots endpoint - restricted to specific IP
    location /screenshots/ {
        allow 5.44.248.123;
        allow 186.250.207.225;
        deny all;
        
        proxy_pass http://127.0.0.1:5401/screenshots/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # API endpoints - restricted to specific IP
    location /api/ {
        allow 5.44.248.123;
        allow 186.250.207.225;
        deny all;
        
        proxy_pass http://127.0.0.1:5401;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Main application (UI) - this should be last to catch all other requests
    location / {
        proxy_pass http://127.0.0.1:5402;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint - restricted to specific IP
    location /health {
        allow 5.44.248.123;
        allow 186.250.207.225;
        deny all;
        
        proxy_pass http://127.0.0.1:5401/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Security and performance
    client_max_body_size 100M;
    keepalive_timeout 65;
    
    # Log files
    access_log /var/log/nginx/cloudflare.w-b.dev.access.log;
    error_log /var/log/nginx/cloudflare.w-b.dev.error.log;
}