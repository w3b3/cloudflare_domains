version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cloudflare-domains-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5400:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # start_period: 5s

  api:
    container_name: cloudflare-domains-api
    build:
      context: ./api
      dockerfile: Dockerfile
      cache_from:
        - cloudflare_domains-api:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: cloudflare_domains-api:latest
    ports:
      - "5401:3333"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
    volumes:
      - ./api/screenshots:/app/screenshots
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ui:
    container_name: cloudflare-domains-ui
    build:
      context: ./ui
      dockerfile: Dockerfile
      cache_from:
        - cloudflare_domains-ui:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
    image: cloudflare_domains-ui:latest
    ports:
      - "5402:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
